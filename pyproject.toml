[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acan-studio"
version = "1.3.0"
description = "An open-source desktop media workspace for video creators."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ACAN Studio contributors" }]

[tool.setuptools.packages.find]
include = ["acan_studio*"]
